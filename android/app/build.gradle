plugins {
    id 'com.android.application'
}

android {
    namespace 'org.ecgrecorder'
    compileSdk 34

    defaultConfig {
        applicationId "org.ecgrecorder"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName "2.1"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    implementation 'com.github.mik3y:usb-serial-for-android:3.8.1'
}
